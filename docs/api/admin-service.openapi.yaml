openapi: 3.0.3
info:
  title: eProcure — Admin & System Config Service API
  description: |
    Hai portal riêng biệt với quyền đặc biệt:

    **1. Admin Portal** (`ADMIN_*` permissions): Quản lý người dùng, roles, catalog, approval rules.  
    **2. System Config Portal** (`SYSTEM_CONFIG` permission): Biến môi trường, cấu hình service, audit log.  
    
    ⚠️ SYSTEM_CONFIG là quyền cực kỳ nhạy cảm — chỉ Super Admin mới có.  
    ⚠️ Hai portal này tách biệt hoàn toàn với hệ thống nghiệp vụ chính.
  version: 1.0.0
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: api.eprocure.internal
tags:
  - name: System Config
    description: Biến môi trường và cấu hình hệ thống (SYSTEM_CONFIG)
  - name: Audit Log
    description: Audit trail bất biến (SYSTEM_AUDIT_VIEW)
  - name: Catalog Admin
    description: Quản lý danh mục (ADMIN_CATALOG_MANAGE)
  - name: Department Admin
    description: Quản lý phòng ban (ADMIN_DEPARTMENT_MANAGE)
  - name: System Health
    description: Theo dõi trạng thái service
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ep_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    SizeParam:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        code: { type: string }
        message: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        isFirst: { type: boolean }
        isLast: { type: boolean }
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            details: { type: array, nullable: true, items: { type: object } }
    EnvVariable:
      type: object
      properties:
        key:
          type: string
          example: REDIS_HOST
        value:
          type: string
          description: Giá trị thực — sensitive values bị mask bằng ***
          example: "redis-cluster.internal"
        isSensitive:
          type: boolean
          description: true = value bị mask trong GET response
        description:
          type: string
          nullable: true
        lastUpdatedAt:
          type: string
          format: date-time
        lastUpdatedBy:
          type: string
    ServiceConfig:
      type: object
      properties:
        serviceName:    { type: string, example: pr-service }
        displayName:    { type: string, example: Purchase Request Service }
        status:         { type: string, enum: [UP, DOWN, DEGRADED, UNKNOWN] }
        version:        { type: string, nullable: true }
        variables:
          type: array
          items:
            $ref: '#/components/schemas/EnvVariable'
        lastHealthCheck: { type: string, format: date-time, nullable: true }
    ServiceConfigUpdateRequest:
      type: object
      required: [variables, confirmationCode, changeReason]
      properties:
        variables:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, value]
            properties:
              key:         { type: string }
              value:       { type: string }
              isSensitive: { type: boolean, default: false }
              description: { type: string, nullable: true }
        confirmationCode:
          type: string
          description: TOTP 2FA code bat buoc cho SYSTEM_CONFIG changes.
        requiresRestart:
          type: boolean
          default: false
        changeReason:
          type: string
          minLength: 10
    ServiceConfigUpdateResult:
      type: object
      properties:
        actionId:        { type: string, format: uuid }
        status:          { type: string, enum: [PENDING_MANUAL_APPLY] }
        updatedCount:    { type: integer }
        requiresRestart: { type: boolean }
        affectedService: { type: string }
        applied:
          type: boolean
          description: false khi action moi chi duoc ghi nhan, chua co runtime executor apply.
    ServiceRestartRequest:
      type: object
      required: [confirmationCode, reason]
      properties:
        confirmationCode: { type: string }
        reason:           { type: string, minLength: 10 }
    ServiceRestartResult:
      type: object
      properties:
        actionId: { type: string, format: uuid }
        status:   { type: string, enum: [PENDING_MANUAL_APPLY] }
        estimatedDowntimeSeconds: { type: integer }
        triggeredAt: { type: string, format: date-time }
        applied:
          type: boolean
          description: false khi restart moi duoc ghi nhan, chua co orchestrator thuc thi.
    EncryptionKeyRotationRequest:
      type: object
      required: [confirmationCode]
      properties:
        confirmationCode: { type: string }
        keySize:          { type: integer, enum: [2048, 4096], default: 2048 }
    EncryptionKeyRotationResult:
      type: object
      properties:
        actionId:         { type: string, format: uuid }
        status:           { type: string, enum: [PENDING_MANUAL_APPLY] }
        newKeyVersion:    { type: string, example: pending-v20260615000000 }
        rotatedAt:        { type: string, format: date-time }
        oldKeyRetiredAt:  { type: string, format: date-time }
        applied:
          type: boolean
          description: false khi rotation moi duoc ghi nhan, chua tao key runtime that.
    AuditLogEntry:
      type: object
      properties:
        id:            { type: integer, format: int64 }
        actor:
          type: object
          properties:
            id:       { type: string, format: uuid }
            name:     { type: string }
            roles:    { type: array, items: { type: string } }
            ip:       { type: string }
        action:        { type: string, example: PR.SUBMITTED }
        entityType:    { type: string, example: PURCHASE_REQUEST }
        entityId:      { type: string, format: uuid, nullable: true }
        entityNumber:  { type: string, nullable: true, example: PR-2025-01-00001 }
        occurredAt:    { type: string, format: date-time }
        httpMethod:    { type: string, nullable: true }
        endpoint:      { type: string, nullable: true }
        requestId:     { type: string, nullable: true }
        isSuccess:     { type: boolean }
        errorCode:     { type: string, nullable: true }
        oldValue:
          nullable: true
          description: JSON snapshot before the change.
          oneOf:
            - type: object
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        newValue:
          nullable: true
          description: JSON snapshot after the change.
          oneOf:
            - type: object
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        description:   { type: string, nullable: true }
        serviceName:   { type: string }
    AuditExportJob:
      type: object
      properties:
        jobId:         { type: string, format: uuid }
        status:        { type: string, enum: [QUEUED, PROCESSING, COMPLETED, FAILED] }
        fromTime:      { type: string, format: date-time }
        toTime:        { type: string, format: date-time }
        actorId:       { type: string, format: uuid, nullable: true }
        entityType:    { type: string, nullable: true }
        action:        { type: string, nullable: true }
        fileName:      { type: string, nullable: true }
        downloadUrl:   { type: string, nullable: true, example: /api/v1/admin/audit-log/export/7d88c23e-0b18-45cc-b5f1-5b6110134f12/download }
        failureReason: { type: string, nullable: true }
        requestedAt:   { type: string, format: date-time }
        completedAt:   { type: string, format: date-time, nullable: true }
        expiresAt:     { type: string, format: date-time, nullable: true }
    ActiveSession:
      type: object
      properties:
        sessionId:    { type: string, format: uuid }
        userId:       { type: string, format: uuid }
        userName:     { type: string }
        fullName:     { type: string }
        ipAddress:    { type: string, nullable: true }
        userAgent:    { type: string, nullable: true }
        createdAt:    { type: string, format: date-time }
        lastActivity: { type: string, format: date-time }
        expiresAt:    { type: string, format: date-time }
    CatalogCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code:                 { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
        name:                 { type: string }
        parentCode:           { type: string, nullable: true }
        requiresSpecialApproval: { type: boolean, default: false }
        specialApproverRole:  { type: string, nullable: true }
        requiresRfqAbove:     { type: string, nullable: true, description: Ngưỡng tiền bắt buộc RFQ }
        isCapex:              { type: boolean, default: false }
    CatalogCategoryAdmin:
      type: object
      properties:
        code:                    { type: string }
        name:                    { type: string }
        parentCode:              { type: string, nullable: true }
        requiresSpecialApproval: { type: boolean }
        specialApproverRole:     { type: string, nullable: true }
        requiresRfqAbove:        { type: string, nullable: true }
        isCapex:                 { type: boolean }
        itemCount:               { type: integer, format: int64 }
        isDeleted:               { type: boolean }
    DepartmentRequest:
      type: object
      required: [code, name]
      properties:
        code:           { type: string, maxLength: 20 }
        name:           { type: string, maxLength: 200 }
        parentId:       { type: string, format: uuid, nullable: true }
        headUserId:     { type: string, format: uuid, nullable: true }
        glAccountPrefix:{ type: string, nullable: true }
    DepartmentAdmin:
      type: object
      properties:
        id:              { type: string, format: uuid }
        code:            { type: string }
        name:            { type: string }
        parentId:        { type: string, format: uuid, nullable: true }
        headUserId:      { type: string, format: uuid, nullable: true }
        glAccountPrefix: { type: string, nullable: true }
        memberCount:     { type: integer, format: int64 }
        childCount:      { type: integer, format: int64 }
        isDeleted:       { type: boolean }

paths:
  # ── System Config Portal ──────────────────────────────────────
  /admin/config/services:
    get:
      tags: [System Config]
      summary: Danh sách tất cả services và biến môi trường
      operationId: listServiceConfigs
      x-required-permission: SYSTEM_CONFIG
      description: |
        Sensitive values (password, secret, key) được mask bằng `***`.  
        Để xem giá trị thực, cần gọi endpoint riêng với xác nhận 2FA.
      responses:
        '200':
          description: Danh sách service configs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceConfig'
                      summary:
                        type: object
                        properties:
                          totalServices: { type: integer }
                          upCount:       { type: integer }
                          downCount:     { type: integer }
                          degradedCount: { type: integer }

  /admin/config/services/{serviceName}:
    get:
      tags: [System Config]
      summary: Chi tiết config của một service
      operationId: getServiceConfig
      x-required-permission: SYSTEM_CONFIG
      parameters:
        - name: serviceName
          in: path
          required: true
          schema: { type: string }
          example: pr-service
      responses:
        '200':
          description: Config của service
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceConfig'

    put:
      tags: [System Config]
      summary: Cập nhật biến môi trường của service
      operationId: updateServiceConfig
      x-required-permission: SYSTEM_CONFIG
      description: |
        Thay đổi config là thao tác nhạy cảm: admin-service xác thực TOTP, kiểm tra idempotency,
        rồi ghi request vào `audit.admin_config_actions`. Runtime apply cần operator/orchestrator executor.
      parameters:
        - name: serviceName
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceConfigUpdateRequest'
      responses:
        '200':
          description: Config action đã được xác thực và ghi nhận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceConfigUpdateResult'

  /admin/config/services/{serviceName}/restart:
    post:
      tags: [System Config]
      summary: Restart service (graceful)
      operationId: restartService
      x-required-permission: SYSTEM_CONFIG
      parameters:
        - name: serviceName
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRestartRequest'
      responses:
        '202':
          description: Restart action đã được xác thực và ghi nhận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceRestartResult'

  /admin/config/encryption/rotate-key:
    post:
      tags: [System Config]
      summary: Xoay vòng RSA key pair (encryption key rotation)
      operationId: rotateEncryptionKey
      x-required-permission: SYSTEM_CONFIG
      description: |
        Xác thực TOTP và ghi nhận request xoay key vào `audit.admin_config_actions`.
        Runtime tạo key/retire key cần secret manager hoặc executor riêng.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptionKeyRotationRequest'
      responses:
        '200':
          description: Rotation action đã được xác thực và ghi nhận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EncryptionKeyRotationResult'

  # ── Audit Log ─────────────────────────────────────────────────
  /admin/audit-log:
    get:
      tags: [Audit Log]
      summary: Truy vấn audit log bất biến
      operationId: queryAuditLog
      x-required-permission: SYSTEM_AUDIT_VIEW
      parameters:
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: entity_type
          in: query
          schema: { type: string, example: PURCHASE_REQUEST }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, example: PR.SUBMITTED }
        - name: service_name
          in: query
          schema: { type: string }
        - name: is_success
          in: query
          schema: { type: boolean }
        - name: from_time
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to_time
          in: query
          required: true
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLogEntry'
                      meta:
                        $ref: '#/components/schemas/PageMeta'

  /admin/audit-log/export:
    post:
      tags: [Audit Log]
      summary: Xuất audit log ra Excel (cho kiểm toán)
      operationId: exportAuditLog
      x-required-permission: SYSTEM_AUDIT_VIEW
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromTime, toTime]
              properties:
                fromTime:   { type: string, format: date-time }
                toTime:     { type: string, format: date-time }
                actorId:    { type: string, format: uuid, nullable: true }
                entityType: { type: string, nullable: true }
                action:     { type: string, nullable: true }
      responses:
        '202':
          description: Job xuất đã được tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditExportJob'
        '200':
          description: Job cũ được replay theo Idempotency-Key
          headers:
            Idempotency-Replayed:
              schema: { type: string, example: "true" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditExportJob'

  /admin/audit-log/export/{jobId}:
    get:
      tags: [Audit Log]
      summary: Xem trạng thái audit export job
      operationId: getAuditExportJob
      x-required-permission: SYSTEM_AUDIT_VIEW
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Trạng thái job xuất audit log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditExportJob'
        '404':
          description: Không tìm thấy job thuộc user hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/audit-log/export/{jobId}/download:
    get:
      tags: [Audit Log]
      summary: Download file XLSX của audit export job
      operationId: downloadAuditExport
      x-required-permission: SYSTEM_AUDIT_VIEW
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: File audit log XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: Job chưa hoàn tất, đã hết hạn, mất file, hoặc không thuộc user hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Catalog Admin ─────────────────────────────────────────────
  /admin/catalog/categories:
    get:
      tags: [Catalog Admin]
      summary: Danh sách danh mục hàng hóa (admin view)
      operationId: adminListCategories
      x-required-permission: ADMIN_CATALOG_MANAGE
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Danh sách categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CatalogCategoryAdmin'

    post:
      tags: [Catalog Admin]
      summary: Tạo danh mục mới
      operationId: createCategory
      x-required-permission: ADMIN_CATALOG_MANAGE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCategoryRequest'
      responses:
        '201':
          description: Danh mục đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CatalogCategoryAdmin'

  /admin/catalog/categories/{code}:
    put:
      tags: [Catalog Admin]
      summary: Cập nhật danh mục
      operationId: updateCategory
      x-required-permission: ADMIN_CATALOG_MANAGE
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCategoryRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CatalogCategoryAdmin'

  /admin/catalog/categories/{code}/deactivate:
    patch:
      tags: [Catalog Admin]
      summary: Vô hiệu hóa danh mục (soft delete)
      operationId: deactivateCategory
      x-required-permission: ADMIN_CATALOG_MANAGE
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Đã vô hiệu hóa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CatalogCategoryAdmin'

  # ── Department Admin ──────────────────────────────────────────
  /admin/departments:
    post:
      tags: [Department Admin]
      summary: Tạo phòng ban mới
      operationId: createDepartment
      x-required-permission: ADMIN_DEPARTMENT_MANAGE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        '201':
          description: Phòng ban đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DepartmentAdmin'

  /admin/departments/{id}:
    put:
      tags: [Department Admin]
      summary: Cập nhật phòng ban
      operationId: updateDepartment
      x-required-permission: ADMIN_DEPARTMENT_MANAGE
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DepartmentAdmin'

  /admin/departments/{id}/deactivate:
    patch:
      tags: [Department Admin]
      summary: Vô hiệu hóa phòng ban (kiểm tra không còn nhân viên active)
      operationId: deactivateDepartment
      x-required-permission: ADMIN_DEPARTMENT_MANAGE
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Đã vô hiệu hóa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DepartmentAdmin'
        '409':
          description: Phòng ban còn nhân viên active hoặc child department — không thể vô hiệu hóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── System Health ─────────────────────────────────────────────
  /admin/health:
    get:
      tags: [System Health]
      summary: Trạng thái tất cả services và infrastructure
      operationId: getSystemHealth
      x-required-permission: SYSTEM_CONFIG
      responses:
        '200':
          description: Tổng quan sức khỏe hệ thống
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          overallStatus: { type: string, enum: [UP, DEGRADED, DOWN] }
                          services:
                            type: array
                            items:
                              type: object
                              properties:
                                name:         { type: string }
                                status:       { type: string, enum: [UP, DOWN, DEGRADED, UNKNOWN] }
                                responseTime: { type: integer, description: ms }
                                uptime:       { type: string, nullable: true }
                                lastCheck:    { type: string, format: date-time }
                          infrastructure:
                            type: object
                            properties:
                              postgresql:
                                type: object
                                properties:
                                  status:       { type: string }
                                  connections:  { type: integer }
                                  maxConnections: { type: integer }
                              redis:
                                type: object
                                properties:
                                  status:       { type: string }
                                  usedMemory:   { type: string }
                                  maxMemory:    { type: string }
                                  keyCount:     { type: integer }
                              kafka:
                                type: object
                                properties:
                                  status:       { type: string }
                                  topicCount:   { type: integer }
                                  lagByGroup:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        group:  { type: string }
                                        lag:    { type: integer }
                          checkedAt: { type: string, format: date-time }

  /admin/sessions:
    get:
      tags: [System Config]
      summary: Danh sách phiên đăng nhập đang active
      operationId: listActiveSessions
      x-required-permission: SYSTEM_CONFIG
      parameters:
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActiveSession'
                      meta:
                        $ref: '#/components/schemas/PageMeta'

  /admin/sessions/{sessionId}/invalidate:
    patch:
      tags: [System Config]
      summary: Buộc đăng xuất một phiên cụ thể
      operationId: invalidateSession
      x-required-permission: SYSTEM_CONFIG
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, example: "Phát hiện đăng nhập đáng ngờ từ IP lạ" }
      responses:
        '200':
          description: Session đã bị invalidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
