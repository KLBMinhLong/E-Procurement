<ep-modal
  [open]="isOpen"
  [title]="'admin.users.resetPasswordModal.title' | translate"
  (close)="closeModal.emit()">
  @if (user; as u) {
    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="user-form">
      <div class="form-grid" style="display: flex; flex-direction: column; gap: var(--spacing-4);">
        <ep-form-field
          [label]="'admin.users.resetPasswordModal.newPassword' | translate"
          [error]="resetPasswordForm.get('newPassword')?.touched && resetPasswordForm.get('newPassword')?.hasError('required') ? ('admin.users.validation.required' | translate) : (resetPasswordForm.get('newPassword')?.touched && resetPasswordForm.get('newPassword')?.hasError('minlength') ? ('admin.users.validation.passwordMinLength' | translate) : (resetPasswordForm.get('newPassword')?.touched && resetPasswordForm.get('newPassword')?.hasError('pattern') ? ('admin.users.validation.passwordPattern' | translate) : null))">
          <input
            id="form-newPassword"
            type="password"
            formControlName="newPassword"
            class="form-input"
            [placeholder]="'admin.users.resetPasswordModal.newPasswordPlaceholder' | translate" />
        </ep-form-field>

        <ep-form-field
          [label]="'admin.users.resetPasswordModal.confirmPassword' | translate"
          [error]="resetPasswordForm.get('confirmPassword')?.touched && resetPasswordForm.get('confirmPassword')?.hasError('required') ? ('admin.users.validation.required' | translate) : (resetPasswordForm.get('confirmPassword')?.touched && resetPasswordForm.get('confirmPassword')?.hasError('passwordMismatch') ? ('admin.users.validation.passwordMismatch' | translate) : null)">
          <input
            id="form-confirmPassword"
            type="password"
            formControlName="confirmPassword"
            class="form-input"
            [placeholder]="'admin.users.resetPasswordModal.confirmPasswordPlaceholder' | translate" />
        </ep-form-field>
      </div>
      <div class="form-actions">
        <ep-button
          variant="ghost"
          [disabled]="isSubmitting"
          (click)="closeModal.emit()"
          type="button">
          {{ 'action.cancel' | translate }}
        </ep-button>
        <ep-button
          variant="primary"
          type="submit"
          [loading]="isSubmitting"
          [disabled]="isSubmitting || resetPasswordForm.invalid">
          {{ 'action.submit' | translate }}
        </ep-button>
      </div>
    </form>
  }
</ep-modal>
