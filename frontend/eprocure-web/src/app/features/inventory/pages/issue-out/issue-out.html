<div class="issue-out-container">
  <div class="header">
    <div class="breadcrumb">
      <a (click)="cancel()" class="back-link">&larr; Back to Dashboard</a>
    </div>
    <div class="title-row">
      <div class="title-text">
        <h1 class="ep-text-heading-xl">Issue Out Stock</h1>
        <p class="ep-text-body-md text-neutral-600">
          Record stock leaving the warehouse to fulfill internal requests or projects.
        </p>
      </div>
    </div>
  </div>

  <div class="content">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="issue-form">
      
      <!-- General Info -->
      <div class="form-section">
        <h3 class="section-title">General Information</h3>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="warehouseId" class="ep-label">Warehouse <span class="required">*</span></label>
            <input
              type="text"
              id="warehouseId"
              formControlName="warehouseId"
              class="ep-input"
              placeholder="e.g. WH-001"
              [class.error]="form.get('warehouseId')?.invalid && form.get('warehouseId')?.touched"
            />
            <span class="ep-error-text" *ngIf="form.get('warehouseId')?.invalid && form.get('warehouseId')?.touched">
              Warehouse is required
            </span>
          </div>

          <div class="form-group flex-1">
            <label for="recipientId" class="ep-label">Recipient ID <span class="required">*</span></label>
            <input
              type="text"
              id="recipientId"
              formControlName="recipientId"
              class="ep-input"
              placeholder="User ID or Department ID"
              [class.error]="form.get('recipientId')?.invalid && form.get('recipientId')?.touched"
            />
            <span class="ep-error-text" *ngIf="form.get('recipientId')?.invalid && form.get('recipientId')?.touched">
              Recipient is required
            </span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="prId" class="ep-label">Related PR ID (Optional)</label>
            <input
              type="text"
              id="prId"
              formControlName="prId"
              class="ep-input"
              placeholder="e.g. PR-2023-001"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="notes" class="ep-label">Notes / Justification</label>
          <textarea
            id="notes"
            formControlName="notes"
            class="ep-input"
            rows="3"
            placeholder="Reason for issuing out..."
          ></textarea>
        </div>
      </div>

      <!-- Line Items -->
      <div class="form-section">
        <div class="section-header-flex">
          <h3 class="section-title">Items to Issue</h3>
          <button type="button" class="ep-button ep-button-secondary ep-button-sm" (click)="addItem()">
            + Add Item
          </button>
        </div>
        
        <div class="table-container">
          <table class="ep-table">
            <thead>
              <tr>
                <th>Item Code <span class="required">*</span></th>
                <th>Quantity <span class="required">*</span></th>
                <th>Unit <span class="required">*</span></th>
                <th class="action-col"></th>
              </tr>
            </thead>
            <tbody formArrayName="items">
              <tr *ngFor="let itemForm of items.controls; let i = index" [formGroupName]="i">
                <td>
                  <input type="text" formControlName="itemCode" class="ep-input" placeholder="e.g. IT-LAP-01" />
                </td>
                <td>
                  <input type="number" formControlName="quantity" class="ep-input" min="0.01" step="0.01" />
                </td>
                <td>
                  <select formControlName="unit" class="ep-input">
                    <option value="EA">Each (EA)</option>
                    <option value="BOX">Box (BOX)</option>
                    <option value="KG">Kilogram (KG)</option>
                    <option value="L">Liter (L)</option>
                  </select>
                </td>
                <td class="action-col">
                  <button type="button" class="icon-button danger" (click)="removeItem(i)" [disabled]="items.length === 1" title="Remove item">
                    ✕
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="ep-button ep-button-secondary" (click)="cancel()">
          Cancel
        </button>
        <button 
          type="submit" 
          class="ep-button ep-button-primary"
          [disabled]="form.invalid || submitting() || items.length === 0"
        >
          <span class="spinner" *ngIf="submitting()"></span>
          {{ submitting() ? 'Processing...' : 'Issue Out' }}
        </button>
      </div>
    </form>
  </div>
</div>
