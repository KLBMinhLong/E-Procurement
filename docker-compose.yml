name: eprocure

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-env: &common-env
  TZ: ${TZ:-Asia/Ho_Chi_Minh}

services:
  postgres:
    image: postgres:15-alpine
    container_name: eprocure-postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASS:-postgres_dev_pass}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init/00-init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql:ro
    networks:
      - eprocure-net
    cpus: 0.50
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: eprocure-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      <<: *common-env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - eprocure-net
    cpus: 0.10
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eprocure-kafka
    restart: unless-stopped
    environment:
      <<: *common-env
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-8F4Qf35tQ2e8rE9rQ9k8wA}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
    networks:
      - eprocure-net
    cpus: 0.50
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    logging: *default-logging

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eprocure-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    command: ["bash", "/scripts/create-topics.sh"]
    networks:
      - eprocure-net
    cpus: 0.50
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: "no"
    logging: *default-logging

  keycloak:
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    container_name: eprocure-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      <<: *common-env
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS:-admin_dev_pass}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: db_iam
      KC_DB_SCHEMA: iam_keycloak
      KC_DB_USERNAME: ${IAM_DB_USER:-iam_user}
      KC_DB_PASSWORD: ${IAM_DB_PASS:-iam_pass_dev}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      IAM_PROVIDER_BASE_URL: ${IAM_PROVIDER_BASE_URL:?Set IAM_PROVIDER_BASE_URL in .env}
      IAM_PROVIDER_TIMEOUT_SECONDS: ${IAM_PROVIDER_TIMEOUT_SECONDS:-3}
      IAM_INTERNAL_API_KEY: ${IAM_INTERNAL_API_KEY:?Set IAM_INTERNAL_API_KEY in .env}
    ports:
      - "${KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - ./infra/keycloak/realm-eprocure.json:/opt/keycloak/data/import/realm-eprocure.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eprocure-net
    cpus: 0.25
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *default-logging

  iam-service:
    build:
      context: .
      dockerfile: services/iam-service/Dockerfile
    container_name: eprocure-iam-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: iam-service
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      IAM_DB_HOST: postgres
      IAM_DB_PORT: 5432
      IAM_DB_NAME: db_iam
      IAM_DB_SCHEMA: iam
      IAM_DB_USER: ${IAM_DB_USER:-iam_user}
      IAM_DB_PASS: ${IAM_DB_PASS:-iam_pass_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASS:-}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-eprocure}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-eprocure-iam}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      IAM_INTERNAL_API_KEY: ${IAM_INTERNAL_API_KEY:?Set IAM_INTERNAL_API_KEY in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Strict}
      ENCRYPTION_ENABLED: ${ENCRYPTION_ENABLED:-false}
      RSA_KEY_VERSION: ${RSA_KEY_VERSION:-v2025-01}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY:-}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY:-}
    ports:
      - "${IAM_SERVICE_PORT:-8081}:8081"
    networks:
      - eprocure-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 75s
    logging: *default-logging

  pr-service:
    build:
      context: .
      dockerfile: services/purchase-request-service/Dockerfile
    container_name: eprocure-pr-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: purchase-request-service
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PR_DB_HOST: postgres
      PR_DB_PORT: 5432
      PR_DB_NAME: db_procurement
      PR_DB_SCHEMA: pr
      PR_DB_USER: ${PR_DB_USER:-pr_user}
      PR_DB_PASS: ${PR_DB_PASS:-pr_pass_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASS:-}
      PR_NUMBER_PREFIX: ${PR_NUMBER_PREFIX:-PR}
      PR_ATTACHMENT_MAX_SIZE_MB: ${PR_ATTACHMENT_MAX_SIZE_MB:-20}
      PR_EMERGENCY_MONTHLY_LIMIT: ${PR_EMERGENCY_MONTHLY_LIMIT:-3}
    ports:
      - "${PR_SERVICE_PORT:-8082}:8082"
    networks:
      - eprocure-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 75s
    logging: *default-logging

  nginx-gateway:
    image: nginx:1.25-alpine
    container_name: eprocure-nginx-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      IAM_SERVICE_URL: ${IAM_SERVICE_URL:-http://iam-service:8081}
      PR_SERVICE_URL: ${PR_SERVICE_URL:-http://pr-service:8082}
      APPROVAL_SERVICE_URL: ${APPROVAL_SERVICE_URL:-http://approval-service:8083}
      FINANCE_SERVICE_URL: ${FINANCE_SERVICE_URL:-http://finance-service:8084}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:8085}
      VENDOR_SERVICE_URL: ${VENDOR_SERVICE_URL:-http://vendor-service:8086}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8087}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8088}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin-service:8089}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/templates/proxy-common.template:/etc/nginx/templates/proxy-common.template:ro
      - ./infra/nginx/templates/proxy-protected.template:/etc/nginx/templates/proxy-protected.template:ro
    networks:
      - eprocure-net
    cpus: 0.10
    mem_limit: 64m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: eprocure-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    environment:
      <<: *common-env
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - eprocure-net
    cpus: 0.10
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.2
    container_name: eprocure-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      <<: *common-env
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASS:-admin_dev_pass}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - eprocure-net
    depends_on:
      - prometheus
      - loki
      - tempo
    cpus: 0.10
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
    logging: *default-logging

  loki:
    image: grafana/loki:2.9.8
    container_name: eprocure-loki
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    environment:
      <<: *common-env
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - eprocure-net
    cpus: 0.10
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.4.1
    container_name: eprocure-tempo
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    environment:
      <<: *common-env
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tmp/tempo
    networks:
      - eprocure-net
    cpus: 0.10
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
    logging: *default-logging

networks:
  eprocure-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
