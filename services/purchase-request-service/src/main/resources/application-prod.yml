spring:
  datasource:
    url: jdbc:postgresql://${PR_DB_HOST}:${PR_DB_PORT:5432}/${PR_DB_NAME:db_procurement}
    username: ${PR_DB_USER}
    password: ${PR_DB_PASS}
    hikari:
      connection-init-sql: SET search_path TO ${PR_DB_SCHEMA:pr}
      minimum-idle: 5
      maximum-pool-size: 20
  flyway:
    schemas: ${PR_DB_SCHEMA:pr}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS}
      database: ${REDIS_DB:0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eprocure:
  internal:
    api-key: ${PR_INTERNAL_API_KEY}
  pr:
    integration:
      fallback-enabled: false
