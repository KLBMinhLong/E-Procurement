spring:
  datasource:
    url: jdbc:postgresql://${FINANCE_DB_HOST}:${FINANCE_DB_PORT:5432}/${FINANCE_DB_NAME}
    username: ${FINANCE_DB_USER}
    password: ${FINANCE_DB_PASS}
    hikari:
      connection-init-sql: SET search_path TO ${FINANCE_DB_SCHEMA:finance}
  flyway:
    schemas: ${FINANCE_DB_SCHEMA:finance}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: finance-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

eprocure:
  internal:
    api-key: ${FINANCE_INTERNAL_API_KEY}
  finance:
    integration:
      kafka-enabled: ${FINANCE_KAFKA_ENABLED:true}
      kafka-auto-startup: ${FINANCE_KAFKA_AUTO_STARTUP:true}
      default-gl-account-code: ${FINANCE_DEFAULT_GL_ACCOUNT_CODE:6002}
    kafka:
      topics:
        rfq-awarded: ${FINANCE_KAFKA_TOPIC_RFQ_AWARDED:procurement.rfq.awarded}
        po-issued: ${FINANCE_KAFKA_TOPIC_PO_ISSUED:procurement.po.issued}
        email-send: ${FINANCE_KAFKA_TOPIC_EMAIL_SEND:notification.email.send}
        gr-created: ${FINANCE_KAFKA_TOPIC_GR_CREATED:inventory.gr.created}
        invoice-matched: ${FINANCE_KAFKA_TOPIC_INVOICE_MATCHED:finance.invoice.matched}
