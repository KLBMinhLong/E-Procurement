server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: ${SERVICE_NAME:admin-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${ADMIN_DB_POOL_MIN:${DB_POOL_MIN:1}}
      maximum-pool-size: ${ADMIN_DB_POOL_MAX:${DB_POOL_MAX:4}}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      validation-timeout: 3000
      connection-test-query: SELECT 1
      pool-name: ${SERVICE_NAME:admin-service}-HikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.eprocure.admin.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

eprocure:
  internal:
    api-key: ${ADMIN_INTERNAL_API_KEY:change-me-internal-api-key}
  admin:
    health-timeout: ${ADMIN_HEALTH_TIMEOUT:1s}
    infrastructure:
      postgresql:
        name: postgresql
        host: ${ADMIN_POSTGRES_HOST:${POSTGRES_HOST:localhost}}
        port: ${ADMIN_POSTGRES_PORT:${POSTGRES_PORT:5432}}
      redis:
        name: redis
        host: ${ADMIN_REDIS_HOST:${REDIS_HOST:localhost}}
        port: ${ADMIN_REDIS_PORT:${REDIS_PORT:6379}}
      kafka:
        name: kafka
        host: ${ADMIN_KAFKA_HOST:${KAFKA_HOST:localhost}}
        port: ${ADMIN_KAFKA_PORT:${KAFKA_PORT:19092}}
    services:
      - name: iam-service
        display-name: IAM Service
        base-url: ${IAM_SERVICE_URL:http://localhost:8081}
        version: ${IAM_SERVICE_VERSION:0.1.0-SNAPSHOT}
        variables:
          - key: SERVICE_NAME
            value: iam-service
            description: Spring application/service name.
          - key: SERVER_PORT
            value: ${IAM_SERVICE_PORT:8081}
            description: HTTP port exposed by IAM service.
          - key: IAM_DB_NAME
            value: ${IAM_DB_NAME:db_iam}
            description: IAM database name.
          - key: IAM_DB_SCHEMA
            value: ${IAM_DB_SCHEMA:iam}
            description: IAM PostgreSQL schema.
          - key: IAM_DB_PASS
            value: ${IAM_DB_PASS:iam_pass_dev}
            sensitive: true
            description: IAM database password, masked in admin responses.
          - key: IAM_INTERNAL_API_KEY
            value: ${IAM_INTERNAL_API_KEY:change-me-internal-api-key}
            sensitive: true
            description: Internal service API key, never exposed.
      - name: purchase-request-service
        display-name: Purchase Request Service
        base-url: ${PR_SERVICE_URL:http://localhost:8082}
        version: ${PR_SERVICE_VERSION:0.1.0-SNAPSHOT}
        variables:
          - key: SERVICE_NAME
            value: pr-service
          - key: SERVER_PORT
            value: ${PR_SERVICE_PORT:8082}
          - key: PR_DB_NAME
            value: ${PR_DB_NAME:db_procurement}
          - key: PR_DB_SCHEMA
            value: ${PR_DB_SCHEMA:pr}
          - key: PR_DB_PASS
            value: ${PR_DB_PASS:pr_pass_dev}
            sensitive: true
      - name: approval-service
        display-name: Approval Service
        base-url: ${APPROVAL_SERVICE_URL:http://localhost:8083}
        version: ${APPROVAL_SERVICE_VERSION:0.1.0-SNAPSHOT}
