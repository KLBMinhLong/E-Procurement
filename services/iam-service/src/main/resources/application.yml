server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ${SERVICE_NAME:iam-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${IAM_DB_POOL_MIN:${DB_POOL_MIN:2}}
      maximum-pool-size: ${IAM_DB_POOL_MAX:${DB_POOL_MAX:5}}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: ${SERVICE_NAME:iam-service}-HikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.eprocure.iam.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

eprocure:
  security:
    cookie-name: ${COOKIE_NAME:ep_session}
  session:
    ttl-hours: ${SESSION_TTL_HOURS:8}
    permission-cache-ttl-minutes: ${PERM_CACHE_TTL_MINUTES:15}
  two-factor:
    issuer: ${TWO_FACTOR_ISSUER:eProcure}
    challenge-cookie-name: ${TWO_FACTOR_CHALLENGE_COOKIE_NAME:ep_2fa}
    challenge-ttl-minutes: ${TWO_FACTOR_CHALLENGE_TTL_MINUTES:5}
  encryption:
    algorithm: RSA/ECB/OAEPWithSHA-256AndMGF1Padding
  password-reset:
    ttl-minutes: ${RESET_TOKEN_TTL_MINUTES:15}
  google-oauth:
    scope: ${GOOGLE_OAUTH_SCOPE:openid email profile}
    state-cookie-name: ${GOOGLE_OAUTH_STATE_COOKIE_NAME:ep_oauth_state}
    state-ttl-minutes: ${GOOGLE_OAUTH_STATE_TTL_MINUTES:5}
