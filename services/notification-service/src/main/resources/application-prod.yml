spring:
  datasource:
    url: jdbc:postgresql://${NOTIFICATION_DB_HOST}:${NOTIFICATION_DB_PORT:5432}/${NOTIFICATION_DB_NAME}
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASS}
    hikari:
      connection-init-sql: SET search_path TO ${NOTIFICATION_DB_SCHEMA:notification}
  flyway:
    schemas: ${NOTIFICATION_DB_SCHEMA:notification}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

eprocure:
  internal:
    api-key: ${NOTIFICATION_INTERNAL_API_KEY}
  notification:
    integration:
      kafka-enabled: ${NOTIFICATION_KAFKA_ENABLED:true}
      kafka-auto-startup: ${NOTIFICATION_KAFKA_AUTO_STARTUP:true}
    budget-alert-recipient-ids: ${NOTIFICATION_BUDGET_ALERT_RECIPIENT_IDS:}
    email:
      provider: ${NOTIFICATION_EMAIL_PROVIDER:brevo}
      from-address: ${EMAIL_FROM_ADDRESS}
