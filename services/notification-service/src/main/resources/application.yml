server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: ${SERVICE_NAME:notification-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${NOTIFICATION_DB_POOL_MIN:${DB_POOL_MIN:1}}
      maximum-pool-size: ${NOTIFICATION_DB_POOL_MAX:${DB_POOL_MAX:4}}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      validation-timeout: 3000
      connection-test-query: SELECT 1
      pool-name: ${SERVICE_NAME:notification-service}-HikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
  kafka:
    listener:
      auto-startup: false
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.eprocure.notification.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

eprocure:
  notification:
    default-language: ${NOTIFICATION_DEFAULT_LANGUAGE:vi}
    budget-alert-recipient-ids: ${NOTIFICATION_BUDGET_ALERT_RECIPIENT_IDS:}
    email:
      dispatch-enabled: ${NOTIFICATION_EMAIL_DISPATCH_ENABLED:true}
      provider: ${NOTIFICATION_EMAIL_PROVIDER:logging}
      from-name: ${EMAIL_FROM_NAME:eProcure}
      from-address: ${EMAIL_FROM_ADDRESS:}
      max-attempts: ${EMAIL_RETRY_MAX:3}
      retry-delay-seconds: ${EMAIL_RETRY_DELAY_SECONDS:30}
      retry-fixed-delay-ms: ${NOTIFICATION_EMAIL_RETRY_FIXED_DELAY_MS:60000}
      batch-size: ${NOTIFICATION_EMAIL_BATCH_SIZE:25}
      brevo:
        api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
        api-key: ${BREVO_API_KEY:}
