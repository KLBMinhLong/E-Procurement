server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ${SERVICE_NAME:approval-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${APPROVAL_DB_POOL_MIN:${DB_POOL_MIN:2}}
      maximum-pool-size: ${APPROVAL_DB_POOL_MAX:${DB_POOL_MAX:5}}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      validation-timeout: 3000
      connection-test-query: SELECT 1
      pool-name: ${SERVICE_NAME:approval-service}-HikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.eprocure.approval.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

camunda:
  bpm:
    enabled: true
    auto-deployment-enabled: true
    deployment-resource-pattern:
      - classpath*:/bpmn/*.bpmn
    database:
      schema-update: true
    history-level: audit
    job-execution:
      enabled: true
    metrics:
      enabled: false

eprocure:
  approval:
    default-currency: ${APPROVAL_DEFAULT_CURRENCY:VND}
