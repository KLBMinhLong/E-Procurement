spring:
  datasource:
    url: jdbc:postgresql://${ANALYTICS_DB_HOST:localhost}:${ANALYTICS_DB_PORT:5432}/${ANALYTICS_DB_NAME:db_analytics}
    username: ${ANALYTICS_DB_USER:analytics_user}
    password: ${ANALYTICS_DB_PASS:analytics_pass_dev}
    hikari:
      connection-init-sql: SET search_path TO ${ANALYTICS_DB_SCHEMA:analytics}
  flyway:
    schemas: ${ANALYTICS_DB_SCHEMA:analytics}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: analytics-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

eprocure:
  internal:
    api-key: ${ANALYTICS_INTERNAL_API_KEY:change-me-internal-api-key}
  analytics:
    integration:
      kafka-enabled: ${ANALYTICS_KAFKA_ENABLED:false}
      kafka-auto-startup: ${ANALYTICS_KAFKA_AUTO_STARTUP:false}
    kafka:
      topics:
        po-issued: ${ANALYTICS_KAFKA_TOPIC_PO_ISSUED:procurement.po.issued}
        invoice-matched: ${ANALYTICS_KAFKA_TOPIC_INVOICE_MATCHED:finance.invoice.matched}
        approval-sla-breached: ${ANALYTICS_KAFKA_TOPIC_APPROVAL_SLA_BREACHED:approval.sla.breached}
